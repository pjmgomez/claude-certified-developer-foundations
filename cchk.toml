# commit-check policy for this repository.
# One versioned policy shared by local hooks, CI, and GitHub Actions.
# Learn more: https://commit-check.com/configuration/

[commit]
# Require Conventional Commits: <type>(<scope>): <description>
# https://www.conventionalcommits.org
conventional_commits = true
subject_capitalized = false
subject_imperative = true
subject_min_length = 5
subject_max_length = 80
# Types accepted in commit messages and PR titles.
allow_commit_types = [
    "feat",
    "fix",
    "docs",
    "style",
    "refactor",
    "perf",
    "test",
    "build",
    "ci",
    "chore",
    "revert",
]
allow_merge_commits = true
allow_revert_commits = true
allow_wip_commits = false
require_body = false
require_signed_off_by = false
# Skip checks for automation/bot authors so their commits do not fail CI.
ignore_authors = ["dependabot[bot]", "renovate[bot]", "copilot[bot]", "pre-commit-ci[bot]"]

[branch]
# Require Conventional Branch names: <type>/<description>
# https://conventionalbranch.org
conventional_branch = true
ignore_authors = ["dependabot[bot]", "renovate[bot]", "copilot[bot]", "pre-commit-ci[bot]"]
